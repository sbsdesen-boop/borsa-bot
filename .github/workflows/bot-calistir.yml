name: Borsa Botu

on:
  schedule:
    # Her 30 dakikada bir, :05 ve :35'te (UTC 07-15 = TR 10-18), hafta içi
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: borsa-botu
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install yfinance pandas numpy requests

      - name: Botu çalıştır
        run: python borsa_botu.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sinyal logunu kaydet
        run: |
          git config user.name "borsa-bot"
          git config user.email "borsa-bot@users.noreply.github.com"
          git add signals.csv || true
          git diff --cached --quiet || (git commit -m "sinyal logu güncellendi" && git push)
